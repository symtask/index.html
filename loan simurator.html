<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>5年ルール・階段状ローンシミュレーター（総額表示付）</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 15px;
      background-color: #f4f4f9;
      color: #333;
      max-width: 900px;
      margin: auto;
    }

    h2 {
      border-bottom: 2px solid #333;
      padding-bottom: 10px;
      font-size: 1.5em;
    }

    .summary-box {
      display: flex;
      justify-content: space-around;
      background: #e3f2fd;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 1.1em;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      flex-wrap: wrap;
      /* スマホで折り返すための設定 */
    }

    .summary-box span {
      font-weight: bold;
      font-size: 1.3em;
    }

    .summary-box div {
      margin: 5px 0;
    }

    .text-danger {
      color: #d32f2f;
    }

    .text-primary {
      color: #1976d2;
    }

    .controls {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      margin-bottom: 20px;
    }

    .control-group {
      margin-bottom: 15px;
    }

    label {
      font-weight: bold;
      display: inline-block;
      width: 160px;
    }

    input[type=range] {
      width: calc(100% - 180px);
      vertical-align: middle;
      cursor: pointer;
    }

    .val-display {
      font-weight: bold;
      color: #d32f2f;
    }

    .canvas-container {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      position: relative;
    }

    canvas {
      display: block;
      margin: 0 auto;
      background: #fafafa;
      border: 1px solid #ccc;
      cursor: crosshair;
      width: 100%;
      /* レスポンシブ対応の要 */
      height: auto;
    }

    .legend {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 15px;
      font-weight: bold;
      flex-wrap: wrap;
    }

    .box {
      display: inline-block;
      width: 20px;
      height: 20px;
      vertical-align: middle;
      margin-right: 5px;
    }

    .box.interest {
      background-color: #f8cbad;
    }

    .box.principal {
      background-color: #5b9bd5;
    }

    #tooltip {
      position: absolute;
      background-color: rgba(255, 255, 255, 0.95);
      border: 1px solid #333;
      padding: 10px;
      border-radius: 5px;
      box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.2);
      pointer-events: none;
      font-size: 14px;
      display: none;
      z-index: 10;
      line-height: 1.5;
    }

    .tooltip-title {
      font-weight: bold;
      margin-bottom: 5px;
      border-bottom: 1px solid #ccc;
    }

    /* --- ここからスマホ用の縦型レスポンシブ設定 --- */
    @media (max-width: 600px) {
      .summary-box {
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      label {
        display: block;
        width: 100%;
        margin-bottom: 8px;
      }

      input[type=range] {
        width: 100%;
      }

      h2 {
        font-size: 1.2em;
        text-align: center;
      }

      .canvas-container {
        padding: 10px;
      }
    }
  </style>
</head>

<body>
  <h2>5年ごとの返済額上昇（階段状）と内訳推移</h2>

  <div class="summary-box">
    <div>総支払予定額: <span id="valTotalPayment">0</span> 円</div>
    <div class="text-primary">元金総額: <span id="valTotalPrincipal">0</span> 円</div>
    <div class="text-danger">利息総額: <span id="valTotalInterest">0</span> 円</div>
  </div>

  <div class="controls">
    <div class="control-group">
      <label>ローン残高: <span id="valBalance" class="val-display">3482</span> 万円</label>
      <input type="range" id="sliderBalance" min="500" max="10000" value="3482" step="10">
    </div>
    <div class="control-group">
      <label>残り返済年数: <span id="valYears" class="val-display">33</span> 年</label>
      <input type="range" id="sliderYears" min="5" max="50" value="33" step="1">
    </div>
    <div class="control-group">
      <label>開始時金利: <span id="valStartRate" class="val-display">0.60</span> ％</label>
      <input type="range" id="sliderStartRate" min="0.1" max="5.0" value="0.60" step="0.01">
    </div>
    <div class="control-group">
      <label>最終到達金利: <span id="valRate" class="val-display">2.0</span> ％</label>
      <input type="range" id="sliderRate" min="0.1" max="10.0" value="2.0" step="0.1">
    </div>
  </div>

  <div class="canvas-container">
    <canvas id="loanChart" width="800" height="400"></canvas>
    <div id="tooltip"></div>
    <div class="legend">
      <div><span class="box principal"></span>元金（借金が減る分）</div>
      <div><span class="box interest"></span>利息（銀行の儲け）</div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('loanChart');
    const ctx = canvas.getContext('2d');
    const tooltip = document.getElementById('tooltip');

    const sliderBalance = document.getElementById('sliderBalance');
    const sliderYears = document.getElementById('sliderYears');
    const sliderStartRate = document.getElementById('sliderStartRate');
    const sliderRate = document.getElementById('sliderRate');

    const valBalance = document.getElementById('valBalance');
    const valYears = document.getElementById('valYears');
    const valStartRate = document.getElementById('valStartRate');
    const valRate = document.getElementById('valRate');

    const valTotalPayment = document.getElementById('valTotalPayment');
    const valTotalPrincipal = document.getElementById('valTotalPrincipal');
    const valTotalInterest = document.getElementById('valTotalInterest');

    let globalYearlyData = [];

    function calcPMT(bal, ratePercent, months) {
      if (ratePercent <= 0) return bal / months;
      const r = (ratePercent / 100) / 12;
      return bal * r * Math.pow(1 + r, months) / (Math.pow(1 + r, months) - 1);
    }

    function updateDataAndDraw() {
      const startBalance = parseInt(sliderBalance.value) * 10000;
      const totalYears = parseInt(sliderYears.value);
      const startRate = parseFloat(sliderStartRate.value);
      const targetRate = parseFloat(sliderRate.value);

      valBalance.textContent = sliderBalance.value;
      valYears.textContent = totalYears;
      valStartRate.textContent = startRate.toFixed(2);
      valRate.textContent = targetRate.toFixed(1);

      let balance = startBalance;
      let remainingMonths = totalYears * 12;
      let currentRate = startRate;

      let currentPmt = calcPMT(balance, currentRate, remainingMonths);
      let prevBlockPmt = currentPmt;
      let maxPmt = 0;

      let totalInterestSum = 0;

      globalYearlyData = [];

      for (let year = 1; year <= totalYears; year++) {
        if ((year - 1) % 5 === 0 && year !== 1) {
          let newPmt = calcPMT(balance, currentRate, remainingMonths);
          if (newPmt > prevBlockPmt * 1.25) {
            newPmt = prevBlockPmt * 1.25;
          }
          currentPmt = newPmt;
          prevBlockPmt = currentPmt;
        }

        let yearlyInterest = 0;
        let yearlyPrincipal = 0;

        for (let m = 0; m < 12; m++) {
          let monthlyInterest = balance * ((currentRate / 100) / 12);
          let monthlyPrincipal = currentPmt - monthlyInterest;

          if (monthlyPrincipal < 0) {
            monthlyPrincipal = 0;
          }

          yearlyInterest += monthlyInterest;
          yearlyPrincipal += monthlyPrincipal;
          balance -= monthlyPrincipal;
          remainingMonths--;
          totalInterestSum += monthlyInterest;
        }

        if (currentPmt > maxPmt) maxPmt = currentPmt;

        globalYearlyData.push({
          year: year,
          pmt: currentPmt,
          interest: yearlyInterest / 12,
          principal: yearlyPrincipal / 12,
          rate: currentRate
        });

        currentRate += (targetRate - startRate) / totalYears;
      }

      valTotalPrincipal.textContent = startBalance.toLocaleString();
      valTotalInterest.textContent = Math.round(totalInterestSum).toLocaleString();
      valTotalPayment.textContent = Math.round(startBalance + totalInterestSum).toLocaleString();

      drawGraph(totalYears, maxPmt);
    }

    function drawGraph(totalYears, maxPmt) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const paddingLeft = 80;
      const paddingRight = 20;
      const paddingTop = 20;
      const paddingBottom = 40;

      const chartWidth = canvas.width - paddingLeft - paddingRight;
      const chartHeight = canvas.height - paddingTop - paddingBottom;
      const barWidth = chartWidth / totalYears * 0.8;
      const spacing = chartWidth / totalYears * 0.2;

      const yMax = Math.ceil(maxPmt / 10000) * 10000 + 20000;

      ctx.beginPath();
      ctx.moveTo(paddingLeft, paddingTop);
      ctx.lineTo(paddingLeft, canvas.height - paddingBottom);
      ctx.lineTo(canvas.width - paddingRight, canvas.height - paddingBottom);
      ctx.strokeStyle = '#333';
      ctx.stroke();

      ctx.fillStyle = '#666';
      ctx.font = '12px sans-serif';
      ctx.textAlign = 'right';
      for (let y = 0; y <= yMax; y += 50000) {
        const yPos = canvas.height - paddingBottom - (y / yMax) * chartHeight;
        ctx.fillText(y.toLocaleString() + '円', paddingLeft - 10, yPos + 4);
        ctx.beginPath();
        ctx.moveTo(paddingLeft, yPos);
        ctx.lineTo(canvas.width - paddingRight, yPos);
        ctx.strokeStyle = '#eee';
        ctx.stroke();
      }

      ctx.textAlign = 'center';
      for (let i = 0; i < totalYears; i += 5) {
        const xPos = paddingLeft + i * (barWidth + spacing) + barWidth / 2;
        ctx.fillText((i + 1) + '年', xPos, canvas.height - paddingBottom + 20);
      }

      globalYearlyData.forEach((data, index) => {
        const x = paddingLeft + index * (barWidth + spacing);
        const pHeight = (data.principal / yMax) * chartHeight;
        const iHeight = (data.interest / yMax) * chartHeight;

        ctx.fillStyle = '#5b9bd5';
        ctx.fillRect(x, canvas.height - paddingBottom - pHeight, barWidth, pHeight);

        ctx.fillStyle = '#f8cbad';
        ctx.fillRect(x, canvas.height - paddingBottom - pHeight - iHeight, barWidth, iHeight);

        data.x = x;
        data.width = barWidth;
      });
    }

    // 縮小されたCanvas上でも正確にマウス座標を取るための補正
    canvas.addEventListener('mousemove', function (e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;

      const mouseX = (e.clientX - rect.left) * scaleX;

      let hoveredData = null;

      for (let i = 0; i < globalYearlyData.length; i++) {
        const d = globalYearlyData[i];
        if (mouseX >= d.x && mouseX <= d.x + d.width) {
          hoveredData = d;
          break;
        }
      }

      if (hoveredData) {
        tooltip.innerHTML = `
        <div class="tooltip-title">${hoveredData.year}年目 (金利: ${hoveredData.rate.toFixed(2)}%)</div>
        <div>月々支払: <b>${Math.round(hoveredData.pmt).toLocaleString()}</b> 円</div>
        <div style="color: #d32f2f;">うち利息: ${Math.round(hoveredData.interest).toLocaleString()} 円</div>
        <div style="color: #1976d2;">うち元金: ${Math.round(hoveredData.principal).toLocaleString()} 円</div>
      `;
        // ツールチップの位置は実際の画面座標（e.clientX/Y）を使う
        tooltip.style.left = (e.clientX - rect.left + 15) + 'px';
        tooltip.style.top = (e.clientY - rect.top + 15) + 'px';
        tooltip.style.display = 'block';
      } else {
        tooltip.style.display = 'none';
      }
    });

    canvas.addEventListener('mouseleave', function () {
      tooltip.style.display = 'none';
    });

    sliderBalance.addEventListener('input', updateDataAndDraw);
    sliderYears.addEventListener('input', updateDataAndDraw);
    sliderStartRate.addEventListener('input', updateDataAndDraw);
    sliderRate.addEventListener('input', updateDataAndDraw);

    // ウィンドウサイズ変更時に再描画して見た目を整える
    window.addEventListener('resize', updateDataAndDraw);

    updateDataAndDraw();
  </script>
</body>

</html>
